apply plugin: 'com.android.application'

// Backend the widgets' background refresh calls (same API the web app uses via
// NEXT_PUBLIC_API_URL). A DEBUG build can point at a local backend with
//   ./gradlew assembleDebug -PapiUrl=http://10.0.2.2:5000
// Release builds ignore -PapiUrl and always use the prod https API.
def prodApiUrl = 'https://fintrack-ggiz.onrender.com'
def prodAppUrl = 'https://fintrack-omega-neon.vercel.app'
def debugApiUrl = (project.findProperty('apiUrl') ?: prodApiUrl).toString().replaceAll('/+$', '')

android {
    namespace = "app.fintrack.ai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.fintrack.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", '"https://fintrack-ggiz.onrender.com/"'
        buildConfigField "String", "APP_URL", '"https://fintrack-omega-neon.vercel.app"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            buildConfigField "String", "API_URL", "\"${debugApiUrl}\""
        }
        release {
            buildConfigField "String", "API_URL", "\"${prodApiUrl}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // App lock: system fingerprint prompt + encrypted storage for the PIN hash.
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"
    // Home-screen widgets: periodic + on-demand background refresh.
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Release guard: `CAP_SERVER_URL=http://... npx cap sync` (local testing)
// writes that URL, and cleartext, into the synced capacitor.config.json.
// Refuse to build a release APK/AAB from such a sync.
def verifyReleaseCapacitorConfig = tasks.register('verifyReleaseCapacitorConfig') {
    def configFile = file('src/main/assets/capacitor.config.json')
    inputs.file(configFile).optional()
    doLast {
        if (!configFile.exists()) {
            throw new GradleException("Release guard: ${configFile} is missing. Run `npx cap sync android` (without CAP_SERVER_URL) first.")
        }
        def config = new groovy.json.JsonSlurper().parse(configFile)
        def url = config?.server?.url
        def cleartext = config?.server?.cleartext
        if (url != prodAppUrl || cleartext == true) {
            throw new GradleException(
                "Release guard: capacitor.config.json has server.url=${url}, cleartext=${cleartext}. " +
                "Release builds must load ${prodAppUrl} with cleartext off. " +
                "Re-run `npx cap sync android` without CAP_SERVER_URL.")
        }
    }
}

// preReleaseBuild runs first for both assembleRelease and bundleRelease.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyReleaseCapacitorConfig
}
